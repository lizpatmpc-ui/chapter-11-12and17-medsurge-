<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med-Surg Hematology 90-Question Exam</title>
<style>body{font-family:Arial,sans-serif;max-width:760px;margin:60px auto;padding:20px;color:#16181d} .box{border:1px solid #dfe3e8;border-radius:12px;padding:22px} .err{color:#a22a2a}</style>
</head>
<body>
<div class="box" id="status"><h2>Loading your 90-question Med-Surg exam…</h2><p>Please keep this page open for a moment.</p></div>
<script>
(async()=>{
  try {
    const parts=await Promise.all(['data0.txt','data1.txt'].map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Missing exam data');return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(typeof DecompressionStream==='undefined') throw new Error('This browser cannot decompress the exam. Please open the link in an updated Chrome, Edge, Firefox, or Safari browser.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.getElementById('status').innerHTML='<h2>Exam could not load</h2><p class="err">'+e.message+'</p><p>Please refresh or open this link in Chrome.</p>';
  }
})();
</script>
</body>
</html>
